# --- Quality Profiles ---
profile.LOW=SHADOW_MAP_RESOLUTION:1024 SHADOW_DISTANCE:96.0 SHADOW_PCF_SAMPLES:4 BLOCKLIGHT_OCCLUSION_STEPS:2 SSGI_SAMPLES:2 SSGI_STEPS:3 SSR_STEPS:6 VOLUMETRIC_STEPS:4
profile.MEDIUM=SHADOW_MAP_RESOLUTION:2048 SHADOW_DISTANCE:128.0 SHADOW_PCF_SAMPLES:6 BLOCKLIGHT_OCCLUSION_STEPS:4 SSGI_SAMPLES:4 SSGI_STEPS:5 SSR_STEPS:12 VOLUMETRIC_STEPS:6
profile.HIGH=SHADOW_MAP_RESOLUTION:2048 SHADOW_DISTANCE:160.0 SHADOW_PCF_SAMPLES:8 BLOCKLIGHT_OCCLUSION_STEPS:6 SSGI_SAMPLES:6 SSGI_STEPS:6 SSR_STEPS:16 VOLUMETRIC_STEPS:8
profile.ULTRA=SHADOW_MAP_RESOLUTION:3072 SHADOW_DISTANCE:192.0 SHADOW_PCF_SAMPLES:12 BLOCKLIGHT_OCCLUSION_STEPS:8 SSGI_SAMPLES:8 SSGI_STEPS:8 SSR_STEPS:24 VOLUMETRIC_STEPS:12

# --- Blending Overrides for G-Buffer Normal & Specular/Material Buffers ---
blend.gbuffers_terrain.colortex1=off
blend.gbuffers_terrain.colortex2=off
blend.gbuffers_water.colortex1=off
blend.gbuffers_water.colortex2=off
blend.gbuffers_entities.colortex1=off
blend.gbuffers_entities.colortex2=off
blend.gbuffers_block.colortex1=off
blend.gbuffers_block.colortex2=off
blend.gbuffers_hand.colortex1=off
blend.gbuffers_hand.colortex2=off
blend.gbuffers_textured.colortex1=off
blend.gbuffers_textured.colortex2=off
blend.gbuffers_clouds.colortex1=off
blend.gbuffers_clouds.colortex2=off
blend.gbuffers_weather.colortex1=off
blend.gbuffers_weather.colortex2=off
blend.gbuffers_basic.colortex1=off
blend.gbuffers_basic.colortex2=off
blend.gbuffers_spidereyes.colortex1=off
blend.gbuffers_spidereyes.colortex2=off
blend.gbuffers_skybasic.colortex1=off
blend.gbuffers_skybasic.colortex2=off

# --- Shader Option GUI Screens ---
screen=[SHADOW_SCREEN] [LIGHTING_SCREEN] [HANDLIGHT_SCREEN] [GI_REFLECTION_SCREEN] [ATMOSPHERE_SCREEN] [POST_SCREEN]

screen.SHADOW_SCREEN=SHADOW_MAP_RESOLUTION SHADOW_DISTANCE SHADOW_PCF_SAMPLES SHADOW_SOFTNESS SHADOW_DISTORTION SHADOW_COLORED_GLASS SHADOW_CONTACT_HARDENING
screen.LIGHTING_SCREEN=DIRECTIONAL_BLOCKLIGHT TUBE_OCCLUSION_STRENGTH BLOCKLIGHT_OCCLUSION_STEPS BLOCKLIGHT_INTENSITY BLOCKLIGHT_DISTANCE_FALLOFF MIN_CAVE_BRIGHTNESS SKY_AMBIENT_INTENSITY GROUND_BOUNCE_STRENGTH
screen.HANDLIGHT_SCREEN=HANDLIGHT_MODE HANDLIGHT_INTENSITY HANDLIGHT_RANGE HANDLIGHT_SMOOTH_SPEED
screen.GI_REFLECTION_SCREEN=ENABLE_SSGI SSGI_SAMPLES SSGI_STEPS SSGI_INTENSITY ENABLE_SSR SSR_STEPS SPECULAR_STRENGTH WETNESS_REFLECTION
screen.ATMOSPHERE_SCREEN=ENABLE_VOLUMETRIC_FOG VOLUMETRIC_STEPS FOG_DENSITY_MULTIPLIER COLORED_LIGHT_FOG_INFLUENCE ENABLE_HEAT_HAZE DISTANT_LIGHT_SHIMMER ENABLE_WAVING_FOLIAGE WAVING_SPEED WATER_WAVE_STRENGTH
screen.POST_SCREEN=ENABLE_AUTO_EXPOSURE AUTO_EXPOSURE_SPEED ENABLE_FXAA CAS_SHARPENING CINEMATIC_CONTRAST CINEMATIC_SATURATION SHADOW_TOE_LIFT

# --- Slider Widgets ---
sliders=SHADOW_DISTANCE SHADOW_SOFTNESS TUBE_OCCLUSION_STRENGTH BLOCKLIGHT_INTENSITY HANDLIGHT_INTENSITY HANDLIGHT_RANGE HANDLIGHT_SMOOTH_SPEED SSGI_INTENSITY SPECULAR_STRENGTH WETNESS_REFLECTION MIN_CAVE_BRIGHTNESS SKY_AMBIENT_INTENSITY FOG_DENSITY_MULTIPLIER COLORED_LIGHT_FOG_INFLUENCE DISTANT_LIGHT_SHIMMER WATER_WAVE_STRENGTH CAS_SHARPENING CINEMATIC_CONTRAST CINEMATIC_SATURATION SHADOW_TOE_LIFT
